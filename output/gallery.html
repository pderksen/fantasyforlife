  <dialog id="lightbox" class="p-0 m-0 w-full h-full max-w-none max-h-none border-0 bg-transparent backdrop:bg-ink/90">
    <div class="w-full h-full flex flex-col items-center justify-center gap-3 p-4 sm:p-8 cursor-zoom-out">
      <img id="lightbox-image" src="" alt="" class="flex-1 min-h-0 max-w-full object-contain">
      <p id="lightbox-caption" class="m-0 shrink-0 text-sm text-parchment"></p>
    </div>
    <button type="button" aria-label="Close" class="absolute top-3 right-4 bg-transparent border-0 p-2 leading-none text-3xl text-sage hover:text-parchment cursor-pointer">&times;</button>
    <button type="button" data-lb-nav data-lb-step="-1" aria-label="Previous photo" class="absolute top-1/2 -translate-y-1/2 bg-transparent border-0 px-3 py-6 leading-none text-4xl text-sage hover:text-parchment cursor-pointer select-none left-1 sm:left-4">&#10094;</button>
    <button type="button" data-lb-nav data-lb-step="1" aria-label="Next photo" class="absolute top-1/2 -translate-y-1/2 bg-transparent border-0 px-3 py-6 leading-none text-4xl text-sage hover:text-parchment cursor-pointer select-none right-1 sm:right-4">&#10095;</button>
  </dialog>
  <script>
    (function () {
      var dlg = document.getElementById("lightbox");
      if (!dlg || typeof dlg.showModal !== "function") return;
      var img = document.getElementById("lightbox-image");
      var caption = document.getElementById("lightbox-caption");
      var links = document.querySelectorAll("a[data-lightbox]");
      if (!links.length) return;
      var index = 0;

      function fit() {
        if (!img.naturalWidth) return;
        img.style.maxWidth = "min(100%, " + img.naturalWidth + "px)";
        img.style.maxHeight = "min(100%, " + img.naturalHeight + "px)";
      }
      img.addEventListener("load", fit);

      function show(next) {
        index = (next + links.length) % links.length;
        var link = links[index];
        var thumb = link.querySelector("img");
        img.style.maxWidth = "";
        img.style.maxHeight = "";
        img.src = link.href;
        img.alt = thumb ? thumb.alt : "";
        caption.textContent = link.dataset.caption || "";
        if (img.complete) fit();
      }

      for (var i = 0; i < links.length; i++) {
        links[i].addEventListener("click", function (e) {
          if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button !== 0) return;
          e.preventDefault();
          show(Array.prototype.indexOf.call(links, this));
          dlg.showModal();
        });
      }

      var navs = dlg.querySelectorAll("[data-lb-nav]");
      for (var n = 0; n < navs.length; n++) {
        navs[n].addEventListener("click", function () {
          show(index + Number(this.dataset.lbStep));
        });
      }

      dlg.addEventListener("keydown", function (e) {
        if (navs.length === 0) return;
        if (e.key === "ArrowRight") {
          e.preventDefault();
          show(index + 1);
        } else if (e.key === "ArrowLeft") {
          e.preventDefault();
          show(index - 1);
        }
      });

      dlg.addEventListener("click", function (e) {
        if (e.target === img || (e.target.closest && e.target.closest("[data-lb-nav]"))) return;
        dlg.close();
      });
    })();
  </script>
